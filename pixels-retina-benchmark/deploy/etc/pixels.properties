# Physical-host configuration template for pixels-retina-benchmark.
# Before running Transaction or WriteBuffer benchmarks, replace every
# REPLACE_WITH_* value below. Do not place production credentials in this file.
# Keep this file mode-restricted when it contains a real MySQL password.

# Local benchmark state. Use dedicated, non-production paths owned by the
# benchmark account.
pixels.var.dir=/var/tmp/pixels-retina-benchmark/var/
pixels.history.data.dir=/var/tmp/pixels-retina-benchmark/history/

metadata.db.driver=com.mysql.cj.jdbc.Driver
metadata.db.user=REPLACE_WITH_MYSQL_USER
metadata.db.password=REPLACE_WITH_MYSQL_PASSWORD
metadata.db.url=jdbc:mysql://REPLACE_WITH_MYSQL_HOST:REPLACE_WITH_MYSQL_PORT/pixels_metadata?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=true
metadata.server.host=REPLACE_WITH_BENCHMARK_HOST
metadata.server.port=REPLACE_WITH_METADATA_PORT

trans.server.host=REPLACE_WITH_BENCHMARK_HOST
trans.server.port=REPLACE_WITH_TRANSACTION_PORT
retina.server.host=REPLACE_WITH_BENCHMARK_HOST
retina.server.port=REPLACE_WITH_RETINA_PORT
node.server.host=REPLACE_WITH_BENCHMARK_HOST
node.server.port=REPLACE_WITH_NODE_PORT

# Comma-separated physical etcd hosts. All hosts use the configured port.
etcd.hosts=REPLACE_WITH_ETCD_HOSTS
etcd.port=REPLACE_WITH_ETCD_PORT
heartbeat.lease.ttl.seconds=20
heartbeat.period.seconds=10
node.virtual.num=16
node.bucket.num=128

# Storage and writer settings used by the exact PixelsWriteBuffer path.
enabled.storage.schemes=file
localfs.block.size=4096
localfs.enable.direct.io=false
localfs.enable.mmap=false
localfs.enable.async.io=false
localfs.reader.threads=4
read.request.scheduler=noop
read.request.merge.gap=0
read.request.rate.limit.rps=16000
read.request.rate.limit.mbps=1200
read.request.enable.retry=false
read.request.max.retry.num=0
read.request.retry.interval.ms=1000
block.size=2147483648
block.replication=1
compact.factor=32
row.group.size=268435456
column.chunk.alignment=32
isnull.bitmap.alignment=8
column.chunk.little.endian=true
cache.enabled=false
cache.read.direct=false
metrics.reader.collect.prob=0
metrics.reader.json.dir=/var/tmp/pixels-retina-benchmark/metrics/
os.version=5.15

# Visibility GC is disabled so that its benchmark remains a pure local delete
# test.  WriteBuffer still creates real visibility objects for new files.
retina.enable=true
retina.tile.visibility.capacity=10240
retina.checkpoint.dir=file:///var/tmp/pixels-retina-benchmark/checkpoints
retina.checkpoint.threads=2
retina.gc.interval=-1
retina.storage.gc.enabled=false
retina.storage.gc.threshold=0.5
retina.storage.gc.target.file.size=134217728
retina.storage.gc.max.files.per.group=20
retina.storage.gc.max.file.groups.per.run=10
retina.storage.gc.encoding.level=2
retina.storage.gc.file.retire.delay.hours=24
retina.offload.cache.lease.duration=600
retina.reader.prefetch.threads=4
retina.upsert-mode.enabled=false

retina.buffer.memTable.size=10240
retina.buffer.object.storage.scheme=file
retina.buffer.object.storage.folder=/var/tmp/pixels-retina-benchmark/objects
retina.buffer.object.flush.threads=4
retina.buffer.flush.encodingLevel=2
retina.buffer.flush.nullsPadding=false
retina.buffer.flush.count=20
retina.buffer.flush.interval=30

# Snapshot v2 Index benchmarks overwrite these paths with disposable copies.
# The defaults remain local, dedicated paths for safe singleton initialization.
enabled.single.point.index.schemes=rocksdb
enabled.main.index.scheme=sqlite
index.bucket.num=128
index.rocksdb.data.path=/var/tmp/pixels-retina-benchmark/rocksdb
index.rocksdb.stats.path=/var/tmp/pixels-retina-benchmark/rocksdb-stats
index.sqlite.path=/var/tmp/pixels-retina-benchmark/sqlite
index.main.cache.bucket.num=7
index.cache.enabled=false
index.cache.capacity=10000000
index.cache.expiration.seconds=3600
